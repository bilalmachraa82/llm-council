[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20"]

[phases.install]
cmds = [
  "python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt",
  "cd backend && /opt/venv/bin/python -m prisma generate",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "/opt/venv/bin/python -m backend.main"
